    # Choose at least two pools from dungeons, interiors, overworld, and special_areas.
    # Enable each selected pool's shuffle option. An empty list keeps the pools separate.

  # To mix everything eligible, replace the matching keys above with the settings below.
  # shuffle_dungeon_entrances: true
  # shuffle_boss_entrances: true
  # shuffle_grottos: true
  # shuffle_interiors: true
  # shuffle_overworld: true
  # shuffle_special_areas: true
  # mix_entrance_pools: [dungeons, interiors, overworld, special_areas]
  #
  # Boss rooms and grottos each keep their own pool. Underwater paths mix only with underwater paths.
  # Daytime interiors mix within their hours class. Interiors with unique hours, Trading Post and
  # Swordsman's School stay fixed. Milk Road stays connected to Romani Ranch, and Clock Town gates
  # still lead out of town via land exits. See "Exits that stay fixed (60)" in testing.md.

